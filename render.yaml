# Render blueprint. In Render: New > Blueprint, then select this repository.
# Secrets are marked sync: false, so Render asks for them and they are never stored in git.
services:
  - type: web
    name: barbearia
    runtime: node
    region: frankfurt
    plan: free
    # NODE_ENV=production makes npm skip devDependencies, but the build needs them (TypeScript, Vite, type packages).
    buildCommand: npm ci --include=dev && npm run build
    # Migrations are idempotent, so running them on each start is safe while there is one instance.
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Render's load balancer sits in front of the app and appends X-Forwarded-For.
      - key: TRUST_PROXY
        value: "1"
      # Use the connection string from Neon, with sslmode=verify-full.
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      # Photos. Leave MEDIA_STORAGE empty to keep them on the server's disk, which is lost on every deploy.
      # Set it to s3 and fill the S3_* values with a Cloudflare R2 bucket (see docs/DEPLOY.md).
      # The address the site is reached at. E-mail links are built from it, so it must be the live address (https).
      - key: PUBLIC_URL
        sync: false
      # E-mail: confirmations, reminders, cancellations and password resets. Set MAIL_TRANSPORT=smtp with the
      # SMTP details of a mail service (see docs/DEPLOY.md). Until then, no e-mail is sent.
      - key: MAIL_TRANSPORT
        sync: false
      - key: MAIL_FROM
        sync: false
      # Resend's HTTP API. Use MAIL_TRANSPORT=resend with this key: it works where outbound SMTP times out.
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MEDIA_STORAGE
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false

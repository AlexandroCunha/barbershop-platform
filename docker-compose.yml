# PostgreSQL for local development.
# Start: docker compose up -d     Stop: docker compose down
services:
  db:
    image: postgres:17-alpine
    container_name: barbearia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: barbearia
      POSTGRES_DB: barbearia
    ports:
      - "5434:5432"
    volumes:
      - barbearia-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia -d barbearia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  barbearia-data:

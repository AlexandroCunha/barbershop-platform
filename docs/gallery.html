<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Barbearia screenshots</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f3f0e9;
      --paper-card: #fbfaf7;
      --charcoal: #171717;
      --olive: #41483a;
      --copper: #b77951;
      --copper-ink: #8a5a3b;
      --muted: #5e5a53;
      --line: rgba(23, 23, 23, 0.12);
      --font-serif: "DM Serif Display", Georgia, "Times New Roman", serif;
      --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --paper: #171717;
        --paper-card: #201f1c;
        --charcoal: #f3f0e9;
        --olive: #41483a;
        --copper: #d49a72;
        --copper-ink: #e0ad8c;
        --muted: #b9b3a8;
        --line: rgba(243, 240, 233, 0.14);
      }
    }
    :root[data-theme="dark"] {
      --paper: #171717;
      --paper-card: #201f1c;
      --charcoal: #f3f0e9;
      --olive: #41483a;
      --copper: #d49a72;
      --copper-ink: #e0ad8c;
      --muted: #b9b3a8;
      --line: rgba(243, 240, 233, 0.14);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--paper);
      color: var(--charcoal);
      font-family: var(--font-sans);
      display: grid;
      place-items: center;
      padding: 24px 16px;
    }
    .gallery {
      width: min(1000px, 100%);
      aspect-ratio: 1000 / 640;
      min-height: 0;
      background: var(--paper-card);
      border: 2px solid var(--copper);
      border-radius: 24px;
      display: grid;
      grid-template-rows: auto 1fr auto auto;
      padding: 20px 24px 16px;
      position: relative;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--copper-ink);
    }
    .lang { display: flex; gap: 6px; }
    .lang button, .controls button {
      font: inherit;
      letter-spacing: normal;
      text-transform: none;
      border: 1px solid var(--charcoal);
      background: transparent;
      color: var(--charcoal);
      border-radius: 999px;
      padding: 6px 14px;
      cursor: pointer;
    }
    .lang button[aria-pressed="true"], .controls button.primary {
      background: var(--charcoal);
      color: var(--paper);
    }
    .stage {
      position: relative;
      margin: 18px 0 6px;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }
    .stage img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    .stage .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--charcoal);
      background: var(--paper-card);
      color: var(--charcoal);
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .stage .prev { left: 8px; }
    .stage .next { right: 8px; }
    .stage .nav:focus-visible, .controls button:focus-visible, .lang button:focus-visible, .dots button:focus-visible {
      outline: 2px solid var(--copper);
      outline-offset: 2px;
    }
    .caption { text-align: center; }
    .caption h2 {
      margin: 0;
      font-family: var(--font-serif);
      font-weight: 400;
      font-size: 30px;
    }
    .caption p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 18px;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .dots { display: flex; gap: 8px; }
    .dots button {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      border: 0;
      padding: 0;
      background: var(--charcoal);
      opacity: 0.18;
      cursor: pointer;
    }
    .dots button[aria-current="true"] { background: var(--copper); opacity: 1; }
    .controls { display: flex; gap: 8px; align-items: center; }
    .counter {
      font-size: 14px;
      font-weight: 600;
      color: var(--copper-ink);
      min-width: 56px;
      text-align: right;
    }
    @media (max-width: 640px) {
      .gallery { aspect-ratio: auto; min-height: 560px; }
      .caption h2 { font-size: 24px; }
      .caption p { font-size: 16px; }
    }
  </style>
</head>
<body>
  <main class="gallery" aria-roledescription="carousel" aria-label="Barbearia screenshots">
    <header>
      <span id="eyebrow">Barbearia · preview</span>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="pt" aria-pressed="false">PT</button>
      </div>
    </header>

    <div class="stage" aria-live="polite">
      <img id="shot" alt="">
      <button type="button" class="nav prev" aria-label="Previous screenshot">‹</button>
      <button type="button" class="nav next" aria-label="Next screenshot">›</button>
    </div>

    <div class="caption">
      <h2 id="title"></h2>
      <p id="text"></p>
    </div>

    <div class="footer">
      <div class="dots" id="dots"></div>
      <div class="controls">
        <button type="button" id="play" class="primary" aria-pressed="true">Pause</button>
        <span class="counter" id="counter"></span>
      </div>
    </div>
  </main>

  <script>
    const SLIDES = [
      { file: "01-website-hero.png", en: ["The website", "A first impression that fits the shop"], pt: ["O site", "Uma primeira impressão que combina com a barbearia"], alt: ["Website hero", "Site: seção principal"] },
      { file: "02-barbers-and-services-menu.png", en: ["Barbers and services", "Pick a barber and a service side by side"], pt: ["Barbeiros e serviços", "Escolha um barbeiro e um serviço lado a lado"], alt: ["Barbers and services menu", "Barbeiros e cardápio de serviços"] },
      { file: "03-booking-date-and-time.png", en: ["Booking", "Choose a day and a free time"], pt: ["Agendamento", "Escolha um dia e um horário livre"], alt: ["Choosing a date and time", "Escolha de data e horário"] },
      { file: "04-booking-details-and-summary.png", en: ["Confirm", "A live summary of the appointment"], pt: ["Confirmação", "Um resumo ao vivo do atendimento"], alt: ["Customer details and summary", "Dados do cliente e resumo"] },
      { file: "05-mobile-hero.png", en: ["Mobile first", "It looks great on a phone"], pt: ["Feito para o celular", "Fica ótimo no telefone"], alt: ["Mobile view of the website", "Site no celular"] },
      { file: "06-mobile-barbers.png", en: ["Mobile barbers", "The team, one tap away"], pt: ["Barbeiros no celular", "A equipe a um toque de distância"], alt: ["Mobile barbers section", "Seção de barbeiros no celular"] },
      { file: "07-owner-area-business.png", en: ["Owner area", "The owner edits everything without touching code"], pt: ["Área do dono", "O dono edita tudo sem mexer em código"], alt: ["Owner area: business details", "Área do dono: dados do negócio"] },
      { file: "08-owner-area-services.png", en: ["Services", "Prices, durations and descriptions"], pt: ["Serviços", "Preços, durações e descrições"], alt: ["Owner area: services", "Área do dono: serviços"] },
      { file: "09-platform-barbershops.png", en: ["Platform owner", "Every shop and its license in one place"], pt: ["Dono da plataforma", "Todas as barbearias e suas licenças em um lugar"], alt: ["Platform area: barbershops and licenses", "Área da plataforma: barbearias e licenças"] },
    ];

    const UI = {
      en: { eyebrow: "Barbearia · preview", prev: "Previous screenshot", next: "Next screenshot", play: "Pause", resume: "Play", dot: "Show screenshot" },
      pt: { eyebrow: "Barbearia · prévia", prev: "Captura anterior", next: "Próxima captura", play: "Pausar", resume: "Reproduzir", dot: "Mostrar captura" },
    };
    const SECONDS = 4;

    let lang = "en";
    let index = 0;
    let playing = true;
    let timer = null;

    const shot = document.getElementById("shot");
    const title = document.getElementById("title");
    const text = document.getElementById("text");
    const counter = document.getElementById("counter");
    const dots = document.getElementById("dots");
    const playButton = document.getElementById("play");
    const eyebrow = document.getElementById("eyebrow");

    function pad(n) { return String(n).padStart(2, "0"); }

    function render() {
      const slide = SLIDES[index];
      const [heading, caption] = slide[lang];
      shot.src = "screenshots/" + slide.file;
      shot.alt = slide.alt[lang === "en" ? 0 : 1];
      title.textContent = heading;
      text.textContent = caption;
      counter.textContent = `${pad(index + 1)} / ${pad(SLIDES.length)}`;
      [...dots.children].forEach((dot, i) => dot.setAttribute("aria-current", String(i === index)));
      eyebrow.textContent = UI[lang].eyebrow;
      document.querySelector(".prev").setAttribute("aria-label", UI[lang].prev);
      document.querySelector(".next").setAttribute("aria-label", UI[lang].next);
      playButton.textContent = playing ? UI[lang].play : UI[lang].resume;
      playButton.setAttribute("aria-pressed", String(playing));
    }

    function go(step) {
      index = (index + step + SLIDES.length) % SLIDES.length;
      render();
      restart();
    }

    function goTo(i) {
      index = i;
      render();
      restart();
    }

    function restart() {
      clearInterval(timer);
      if (playing) timer = setInterval(() => go(1), SECONDS * 1000);
    }

    SLIDES.forEach((_, i) => {
      const dot = document.createElement("button");
      dot.type = "button";
      dot.addEventListener("click", () => goTo(i));
      dots.appendChild(dot);
    });
    [...dots.children].forEach((dot, i) => dot.setAttribute("aria-label", `${UI[lang].dot} ${i + 1}`));

    document.querySelector(".prev").addEventListener("click", () => go(-1));
    document.querySelector(".next").addEventListener("click", () => go(1));
    playButton.addEventListener("click", () => {
      playing = !playing;
      render();
      restart();
    });
    document.querySelectorAll(".lang button").forEach((button) => {
      button.addEventListener("click", () => {
        lang = button.dataset.lang;
        document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b === button)));
        [...dots.children].forEach((dot, i) => dot.setAttribute("aria-label", `${UI[lang].dot} ${i + 1}`));
        render();
      });
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") go(1);
      if (event.key === "ArrowLeft") go(-1);
    });

    render();
    restart();
  </script>
</body>
</html>
